# Ban ngành
items:
  - name: "Ban Thờ Phượng"
    desc: "Hướng dẫn Hội Thánh ca ngợi Chúa mỗi Chúa Nhật. Luôn chào đón người biết hát hoặc chơi nhạc cụ."
    lead: "Liên hệ: Ban Chấp Sự"
  - name: "Ban Thiếu Nhi"
    desc: "Dạy Lời Chúa cho các em bằng tiếng Việt song song với giờ thờ phượng người lớn."
    lead: "Liên hệ: Ban Chấp Sự"
  - name: "Ban Thanh Niên – Sinh Viên"
    desc: "Thông công, học Kinh Thánh và nâng đỡ các bạn trẻ xa nhà."
    lead: "Liên hệ: Ban Chấp Sự"
  - name: "Ban Cầu Nguyện"
    desc: "Cầu thay cho nhu cầu của tín hữu, Hội Thánh và quê hương Việt Nam."
    lead: "Liên hệ: Ban Chấp Sự"
  - name: "Ban Tiếp Tân & Thăm Viếng"
    desc: "Chào đón người mới, thăm viếng và giúp đỡ tín hữu khi đau ốm hay gặp khó khăn."
    lead: "Liên hệ: Ban Chấp Sự"
  - name: "Ban Truyền Giáo"
    desc: "Chia sẻ Tin Lành cho cộng đồng người Việt tại Singapore và hỗ trợ công tác truyền giáo."
    lead: "Liên hệ: Ban Chấp Sự"
