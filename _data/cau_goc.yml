# Câu gốc xoay vòng theo ngày
items:
  - text: "Hãy đến cùng Ta, hết thảy những kẻ mệt mỏi và gánh nặng, Ta sẽ cho các ngươi được yên nghỉ."
    ref: "Ma-thi-ơ 11:28"
  - text: "Đức Giê-hô-va là Đấng chăn giữ tôi; tôi sẽ chẳng thiếu thốn gì."
    ref: "Thi Thiên 23:1"
  - text: "Hãy hết lòng tin cậy Đức Giê-hô-va, chớ nương cậy nơi sự thông sáng của con."
    ref: "Châm Ngôn 3:5"
  - text: "Tôi làm được mọi sự nhờ Đấng ban thêm sức cho tôi."
    ref: "Phi-líp 4:13"
  - text: "Vì Đức Chúa Trời yêu thương thế gian, đến nỗi đã ban Con một của Ngài, hầu cho hễ ai tin Con ấy không bị hư mất mà được sự sống đời đời."
    ref: "Giăng 3:16"
  - text: "Hãy vui mừng mãi mãi, cầu nguyện không thôi, phàm việc gì cũng phải tạ ơn Chúa."
    ref: "I Tê-sa-lô-ni-ca 5:16–18"
  - text: "Chớ sợ, vì Ta ở với ngươi; chớ kinh khiếp, vì Ta là Đức Chúa Trời ngươi!"
    ref: "Ê-sai 41:10"
